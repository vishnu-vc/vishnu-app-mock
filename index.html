</style></head><body><header><a class="brand" href="Mocktest-Studio.html"><span class="logo">✓</span>Mocktest <strong>Studio</strong></a><span class="header-note">YOUR PRACTICE SPACE</span></header><main><div class="heading"><div><p class="eyebrow">PRACTICE WITH PURPOSE</p><h1 id="page-title">Make every question count.</h1><p id="subtitle">Your question bank. Your pace. Instant feedback.</p></div><span class="pill">CSV-powered practice</span></div><div id="app"></div></main><footer><span>Mocktest Studio</span><span>Files are read in your browser. Tests reset when you leave or reload.</span></footer><script>const BUNDLED_SAMPLE_CSV = "number,question,option 1,option 2,option 3,option 4,answer\n1,Which of the following best reflects learner-centred teaching?,Teacher dominates classroom interaction,Students actively construct knowledge,Textbook is the sole source of knowledge,Assessment is conducted only at the end,Students actively construct knowledge\n2,The main purpose of formative evaluation is to:,Certify achievement,Rank learners,Provide feedback for improvement,Select students for admission,Provide feedback for improvement\n3,Which level of teaching is most concerned with critical thinking and problem-solving?,Memory level,Understanding level,Reflective level,Recall level,Reflective level\n4,A teacher uses different examples to explain the same concept to learners with varied backgrounds. This primarily demonstrates:,Standardisation,Learner diversity sensitivity,Summative assessment,Content reduction,Learner diversity sensitivity\n5,Which of the following is an essential characteristic of effective teaching?,One-way communication,Rigid lesson delivery,Clear learning objectives,Dependence on rote memorisation,Clear learning objectives\n6,Diagnostic evaluation is mainly used to:,Award grades,Identify learning difficulties,Certify course completion,Compare institutions,Identify learning difficulties\n7,Which teaching method is most appropriate for developing problem-solving skills?,Dictation,Problem-based learning,Pure lecture,Copy writing,Problem-based learning\n8,\"In Bloom's revised taxonomy, which cognitive process is at the highest level?\",Remember,Understand,Evaluate,Create,Create\n9,Which of the following is an example of intrinsic motivation?,Studying for a prize,Learning because the subject is interesting,Working for a promotion,Preparing only to avoid punishment,Learning because the subject is interesting\n10,A rubric is primarily used to:,Prepare a timetable,Specify criteria for assessing performance,Record attendance,Select textbooks,Specify criteria for assessing performance\n11,A research hypothesis is best described as:,A proven fact,A tentative statement that can be tested,A summary of findings,A bibliography entry,A tentative statement that can be tested\n12,Which sampling method gives every member of a population an equal chance of selection?,Purposive sampling,Quota sampling,Simple random sampling,Snowball sampling,Simple random sampling\n13,The variable manipulated by a researcher in an experiment is called the:,Dependent variable,Independent variable,Extraneous variable,Control variable,Independent variable\n14,Reliability of a research instrument refers to its:,Ability to measure the intended construct,Consistency of measurement,Low cost,Ease of administration,Consistency of measurement\n15,Validity refers to the extent to which an instrument:,Produces the same result repeatedly,Measures what it is intended to measure,Contains many questions,Is easy to score,Measures what it is intended to measure\n16,Presenting another person's ideas or words as one's own without acknowledgement is called:,Citation,Peer review,Plagiarism,Triangulation,Plagiarism\n17,Which research design is most suitable for establishing a cause-and-effect relationship?,Experimental research,Historical research,Descriptive survey,Case study,Experimental research\n18,A null hypothesis usually states that:,A significant relationship exists,No significant difference or relationship exists,The sample is biased,The data are qualitative,No significant difference or relationship exists\n19,Which of the following is primary data?,Census report downloaded from a website,Data collected through the researcher's own questionnaire,Published journal article,Government statistical yearbook,Data collected through the researcher's own questionnaire\n20,\"In research ethics, informed consent means that participants:\",Must be paid,Participate after understanding relevant information and agreeing voluntarily,Cannot withdraw,Must know the final result in advance,Participate after understanding relevant information and agreeing voluntarily\n21,\"A passage states: 'Technology can enhance learning, but its effectiveness depends on pedagogy.' Which inference is most appropriate?\",Technology automatically improves all learning,Pedagogy remains important when technology is used,Technology should replace teachers,Pedagogy is unrelated to learning,Pedagogy remains important when technology is used\n22,\"If an author presents both advantages and limitations of online education, the tone is most likely:\",Biased,Balanced,Sarcastic,Hostile,Balanced\n23,The central idea of a passage is best identified by examining:,Only the first word,The recurring theme and supporting statements,Only statistical data,The longest sentence,The recurring theme and supporting statements\n24,\"When a statement is implied but not directly stated in a passage, understanding it requires:\",Memorisation,Inference,Copying,Translation,Inference\n25,\"A passage argues that public libraries remain relevant because they provide digital access, community space, and learning support. The strongest summary is:\",Libraries only lend printed books,Libraries continue to serve multiple educational and community functions,Digital access has eliminated libraries,Libraries are useful only for researchers,Libraries continue to serve multiple educational and community functions\n26,Which expression indicates a contrast in an argument?,Furthermore,Similarly,However,Therefore,However\n27,\"If evidence in a passage contradicts the author's conclusion, a critical reader should:\",Ignore the evidence,Question the strength of the conclusion,Accept the conclusion automatically,Memorise the conclusion only,Question the strength of the conclusion\n28,The phrase 'the findings should be interpreted with caution' most nearly means:,The findings are certainly false,The findings have limitations,The findings need no analysis,The study must be rejected,The findings have limitations\n29,Which of the following is most useful for distinguishing fact from opinion in a passage?,Checking whether a statement can be verified,Counting the words,Looking only at punctuation,Identifying the font size,Checking whether a statement can be verified\n30,An argument is considered coherent when:,Its ideas are logically connected,It contains difficult vocabulary,It is very long,It avoids evidence,Its ideas are logically connected\n31,\"In the communication process, converting an idea into symbols is called:\",Decoding,Encoding,Feedback,Noise,Encoding\n32,Which element confirms whether a message has been understood by the receiver?,Channel,Feedback,Context,Encoding,Feedback\n33,Semantic barriers in communication arise mainly due to:,Physical distance,Differences in interpretation of words and symbols,Poor lighting,Lack of furniture,Differences in interpretation of words and symbols\n34,Which type of communication takes place between persons at the same organisational level?,Vertical communication,Horizontal communication,Downward communication,Upward communication,Horizontal communication\n35,Non-verbal communication includes:,Only written reports,Gestures and facial expressions,Only telephone calls,Only formal speeches,Gestures and facial expressions\n36,\"In classroom communication, 'noise' refers to:\",Only loud sound,Any factor that interferes with effective transmission or understanding,Only student discussion,Teacher feedback,Any factor that interferes with effective transmission or understanding\n37,Which of the following is an example of mass communication?,Private conversation,Television news broadcast,Face-to-face tutorial,Personal email,Television news broadcast\n38,An effective communicator should primarily ensure that the message is:,Ambiguous,Clear and appropriate to the audience,Highly technical in all situations,As lengthy as possible,Clear and appropriate to the audience\n39,Grapevine communication is generally:,Formal and officially documented,Informal,Always written,Legally binding,Informal\n40,The process by which a receiver interprets a message is called:,Encoding,Decoding,Transmission,Filtering,Decoding\n41,\"If the ratio of two numbers is 3:5 and their sum is 64, the smaller number is:\",18,24,32,40,24\n42,A number is increased from 200 to 250. What is the percentage increase?,20%,25%,30%,50%,25%\n43,\"The average of 12, 18, 20, 25 and 30 is:\",19,20,21,22,21\n44,\"If 5 workers complete a task in 12 days at the same rate, how many days will 10 workers take?\",3,6,12,24,6\n45,A train travels 180 km in 3 hours. Its average speed is:,50 km/h,60 km/h,70 km/h,90 km/h,60 km/h\n46,\"What is the simple interest on Rs. 10,000 at 8% per annum for 2 years?\",Rs. 800,\"Rs. 1,200\",\"Rs. 1,600\",\"Rs. 2,000\",\"Rs. 1,600\"\n47,\"If 40% of a number is 120, the number is:\",240,300,360,480,300\n48,\"The next number in the series 2, 6, 12, 20, 30, ? is:\",36,40,42,48,42\n49,\"A shop gives a 10% discount on an item marked Rs. 2,000. The selling price is:\",\"Rs. 1,600\",\"Rs. 1,700\",\"Rs. 1,800\",\"Rs. 1,900\",\"Rs. 1,800\"\n50,\"If x:y = 4:7 and y:z = 14:15, then x:y:z is:\",4:7:15,8:14:15,8:7:15,4:14:15,8:14:15\n51,All professors are teachers. Some teachers are researchers. Which conclusion necessarily follows?,All researchers are professors,Some professors are researchers,All professors are teachers,No teacher is a researcher,All professors are teachers\n52,Statement: All laptops are electronic devices. Some electronic devices are expensive. Which conclusion is valid?,All laptops are expensive,Some laptops are expensive,All laptops are electronic devices,No laptop is expensive,All laptops are electronic devices\n53,\"If 'A implies B' is true and B is false, then A must be:\",True,False,Both true and false,Undetermined,False\n54,Which of the following is an example of deductive reasoning?,Observing several metals expand on heating and generalising,Applying a general law to a particular case,Guessing from intuition,Forming a theory from interviews,Applying a general law to a particular case\n55,Find the odd one out:,Square,Triangle,Circle,Cube,Cube\n56,\"If CAT is coded as DBU, then DOG is coded as:\",EPH,EOG,FPH,DNG,EPH\n57,\"In a valid syllogism, the conclusion must:\",Follow logically from the premises,Always be longer than the premises,Contain new unrelated information,Be an opinion,Follow logically from the premises\n58,Which fallacy attacks the person instead of addressing the argument?,Ad hominem,False dilemma,Slippery slope,Circular reasoning,Ad hominem\n59,A statement that is true under every possible interpretation is called a:,Contradiction,Tautology,Fallacy,Paradox,Tautology\n60,\"If no poets are scientists and some writers are poets, which conclusion follows?\",Some writers are not scientists,All writers are scientists,No writers are scientists,All scientists are writers,Some writers are not scientists\n61,\"A college has 400 students, of whom 240 are women. What percentage of students are women?\",40%,50%,60%,70%,60%\n62,Sales rose from 500 units in January to 650 units in February. The increase was:,100 units,150 units,200 units,250 units,150 units\n63,\"In a pie chart, a sector representing 25% of the total has an angle of:\",45 degrees,60 degrees,90 degrees,120 degrees,90 degrees\n64,\"A table shows scores 60, 70, 80 and 90 for four students. The median score is:\",70,75,80,85,75\n65,\"If a company's expenditure is Rs. 8 lakh and income is Rs. 10 lakh, profit as a percentage of expenditure is:\",20%,25%,30%,40%,25%\n66,\"The mode of the data 2, 3, 3, 4, 5, 3, 6 is:\",2,3,4,5,3\n67,\"A bar graph shows production of 120, 150, 180 and 210 units over four years. The average production is:\",150,160,165,180,165\n68,\"If the total frequency in a distribution is 200 and a category has frequency 50, its relative frequency is:\",0.20,0.25,0.30,0.40,0.25\n69,Which measure is least affected by extreme values?,Mean,Median,Range,Variance,Median\n70,\"If 30% of respondents choose option A out of 500 respondents, how many chose option A?\",100,120,150,180,150\n71,Which of the following is volatile memory?,ROM,Hard disk,RAM,DVD,RAM\n72,The full form of URL is:,Uniform Resource Locator,Universal Record Link,Unified Resource Language,User Reference Locator,Uniform Resource Locator\n73,Which protocol is primarily used for secure web browsing?,HTTP,FTP,HTTPS,SMTP,HTTPS\n74,Phishing is an attempt to:,Improve network speed,Fraudulently obtain sensitive information,Compress files,Create backups,Fraudulently obtain sensitive information\n75,Which of the following is an open-source operating system?,Linux,iOS,Windows,macOS,Linux\n76,Cloud computing primarily enables users to:,Use computing resources over a network,Eliminate all cybersecurity risks,Avoid internet connectivity,Store data only on local disks,Use computing resources over a network\n77,A firewall is used mainly to:,Increase monitor resolution,Control unauthorised network access,Edit images,Compile programs,Control unauthorised network access\n78,Which of the following is a search engine?,Google,WhatsApp,PowerPoint,Bluetooth,Google\n79,MOOC stands for:,Massive Open Online Course,Managed Offline Open Class,Multiple Online Organised Curriculum,Mass Open Offline Course,Massive Open Online Course\n80,Which technology is commonly used for short-range wireless communication between devices?,Bluetooth,HTML,SQL,HTTP,Bluetooth\n81,Sustainable development means development that:,Meets present needs without compromising future generations,Maximises resource use regardless of consequences,Avoids all economic growth,Depends only on fossil fuels,Meets present needs without compromising future generations\n82,Which gas is a major contributor to anthropogenic global warming?,Oxygen,Carbon dioxide,Nitrogen,Argon,Carbon dioxide\n83,The ozone layer is mainly located in the:,Troposphere,Stratosphere,Mesosphere,Thermosphere,Stratosphere\n84,Biodiversity refers to:,Only plant species,\"Variety of life at genetic, species and ecosystem levels\",Only endangered animals,Only microorganisms,\"Variety of life at genetic, species and ecosystem levels\"\n85,Which of the following is a renewable source of energy?,Coal,Petroleum,Solar energy,Natural gas,Solar energy\n86,Eutrophication of water bodies is commonly caused by excessive:,Nutrients,Oxygen,Sand,Salinity only,Nutrients\n87,The 3Rs of waste management are:,\"Reduce, Reuse, Recycle\",\"Recover, Restore, Replace\",\"Reuse, Repair, Remove\",\"Reduce, Rebuild, Return\",\"Reduce, Reuse, Recycle\"\n88,Acid rain is mainly associated with emissions of:,Sulphur dioxide and nitrogen oxides,Oxygen and hydrogen,Methane only,Helium and neon,Sulphur dioxide and nitrogen oxides\n89,An ecological footprint measures:,Only population density,Human demand on natural resources and ecosystems,Only forest cover,Only air pollution,Human demand on natural resources and ecosystems\n90,Which practice contributes most directly to groundwater recharge?,Rainwater harvesting,Deforestation,Concrete paving everywhere,Excessive groundwater pumping,Rainwater harvesting\n91,The University Grants Commission in India is primarily concerned with:,Regulation and coordination of standards in higher education,Conducting school board examinations,Managing all private companies,Running municipal schools,Regulation and coordination of standards in higher education\n92,NAAC is associated mainly with:,Accreditation and quality assessment of higher education institutions,School textbook publication,Entrance coaching,Industrial licensing,Accreditation and quality assessment of higher education institutions\n93,NIRF is used in India for:,Institutional ranking,Issuing passports,School admissions,Tax assessment,Institutional ranking\n94,Academic Bank of Credits is intended to facilitate:,Digital storage and transfer of academic credits,Bank loans to faculty,Cash payment of scholarships only,Purchase of textbooks,Digital storage and transfer of academic credits\n95,SWAYAM is primarily a platform for:,Online courses,Railway booking,Tax filing,University construction,Online courses\n96,The Choice Based Credit System allows students greater flexibility in:,Selecting courses and earning credits,Avoiding all examinations,Ignoring programme requirements,Receiving automatic degrees,Selecting courses and earning credits\n97,Which body conducts the UGC-NET examination on behalf of UGC?,National Testing Agency,NAAC,AICTE,NCERT,National Testing Agency\n98,Institutional autonomy in higher education generally refers to freedom in:,Academic and administrative decision-making within regulatory norms,Ignoring all laws,Awarding degrees without standards,Operating without accountability,Academic and administrative decision-making within regulatory norms\n99,The primary purpose of accreditation in higher education is to:,Assess and assure institutional quality,Guarantee employment to all graduates,Replace teaching,Eliminate examinations,Assess and assure institutional quality\n100,Interdisciplinary education is best described as:,Integrating knowledge and methods from multiple disciplines,Studying only one subject in isolation,Avoiding research,Replacing all core subjects with electives,Integrating knowledge and methods from multiple disciplines\n";
'use strict';
function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false,closed=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else{quoted=false;closed=true;}}else cell+=c;}else if(c==='"'&&!cell&&!closed)quoted=true;else if(c===','||c==='\n'||c==='\r'){row.push(cell.trim());cell='';closed=false;if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(Boolean))rows.push(row);row=[];}}else{if(closed&&!/\s/.test(c))throw Error('Invalid CSV: unexpected text after a quoted value.');cell+=c;}}
 if(quoted)throw Error('Invalid CSV: a quoted value is not closed.');row.push(cell.trim());if(row.some(Boolean))rows.push(row);
 if(rows.length<2)throw Error('Include a header row and at least one question.');
 const norm=s=>s.toLowerCase().replace(/[\s_-]/g,'');const headers=rows.shift().map(norm);if(new Set(headers).size!==headers.length)throw Error('Duplicate column headings found.');
 const qi=headers.indexOf('question'),ai=headers.findIndex(x=>['answer','correctanswer','correctoption'].includes(x));const oi=[1,2,3,4].map((n)=>headers.findIndex(x=>['option'+n,'option'+String.fromCharCode(96+n),String.fromCharCode(96+n)].includes(x)));
 if(qi<0||ai<0||oi.some(x=>x<0))throw Error('Required columns: question, option 1, option 2, option 3, option 4, answer.');
 if(rows.length>1000)throw Error('Please use a maximum of 1,000 questions per test.');
 return rows.map((r,i)=>{const line=i+2;if(r.length!==headers.length)throw Error(`Row ${line}: expected ${headers.length} columns, found ${r.length}. Put values containing commas in double quotes.`);const question=r[qi],options=oi.map(x=>r[x]),answer=r[ai];if(!question||options.some(x=>!x)||!answer)throw Error(`Row ${line}: question, options and answer must not be empty.`);if(new Set(options.map(x=>x.toLowerCase())).size!==4)throw Error(`Row ${line}: options must be distinct.`);let correct=options.indexOf(answer);if(correct<0)correct=options.findIndex(x=>x.toLowerCase()===answer.toLowerCase());if(correct<0&&/^[A-D]$/i.test(answer))correct=answer.toUpperCase().charCodeAt(0)-65;if(correct<0&&/^[1-4]$/.test(answer))correct=Number(answer)-1;let correctAnswers=correct>=0?[correct]:[];
 if(correct<0&&/^[A-D1-4](?:\s*;\s*[A-D1-4])+$/i.test(answer)){correctAnswers=[...new Set(answer.split(';').map(x=>/^[1-4]$/.test(x.trim())?Number(x.trim())-1:x.trim().toUpperCase().charCodeAt(0)-65))].sort();correct=correctAnswers[0];}
 if(correct<0)throw Error(`Row ${line}: answer must match an option, A–D, 1–4, or multiple letters separated by semicolons for CSIR Maths Part C.`);
 const si=headers.indexOf('section');let section=si<0||!r[si]?'':r[si].trim().toUpperCase().replace(/^PART\s*/, '');if(section&&!['A','B','C'].includes(section))throw Error(`Row ${line}: section must be A, B or C.`);
 const ei=headers.indexOf('explanation');return{question,options,correct,correctAnswers,section,explanation:ei<0?'':r[ei]};});
}
function grade(q,choice){if(choice===null)return 'timeout';if(choice===-1)return 'skipped';const selected=Array.isArray(choice)?choice:[choice];const expected=q.correctAnswers||[q.correct];return selected.length===expected.length&&expected.every(x=>selected.includes(x))?'correct':'wrong';}
const CSIR_RULES={chemical:{name:'Chemical Sciences',A:[2,.5],B:[2,.5],C:[4,1]},earth:{name:'Earth Sciences',A:[2,.5],B:[2,.5],C:[4,1.32]},life:{name:'Life Sciences',A:[2,.5],B:[2,.5],C:[4,1]},math:{name:'Mathematical Sciences',A:[2,.5],B:[3,.75],C:[4.75,0]},physical:{name:'Physical Sciences',A:[2,.5],B:[3.5,.875],C:[5,1.25]}};
function marking(exam,subject,part){if(exam==='ugc')return [2,0];if(exam==='psc')return [1,1/3];if(exam!=='csir'||!CSIR_RULES[subject]||!['A','B','C'].includes(part))throw Error('Invalid exam, subject or section.');return CSIR_RULES[subject][part];}
function tally(qs,rs){let earned=0,deducted=0,max=0;qs.forEach((q,i)=>{max+=q.marks[0];if(rs[i]?.status==='correct')earned+=q.marks[0];if(rs[i]?.status==='wrong')deducted+=q.marks[1];});return {earned,deducted,net:earned-deducted,max};}
function fmt(n){return Number((Math.abs(n)<1e-10?0:n).toFixed(3)).toString();}

if(typeof module!=='undefined')module.exports={parseCSV,grade,marking,tally,fmt};
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bank=[],filename='',error='',busy=false,seconds=30,timed=true,overrides={},questions=[],results=[],index=0,phase='setup',deadline=0,interval=null;
let exam='ugc',subject='chemical',defaultPart='A',pending=[];
const score=()=>results.filter(x=>x?.status==='correct').length;
const totals=()=>tally(questions,results);
const examLabel=()=>exam==='ugc'?'UGC NET':exam==='psc'?'Kerala PSC':'CSIR NET · '+CSIR_RULES[subject].name;
const answerText=(q,values)=>values.map(i=>String.fromCharCode(65+i)+'. '+q.options[i]).join(' | ');
const rightText=q=>answerText(q,q.correctAnswers||[q.correct]);
const delta=i=>results[i]?.status==='correct'?questions[i].marks[0]:results[i]?.status==='wrong'?-questions[i].marks[1]:0;
function ruleSummary(){const [positive,negative]=marking(exam,subject,defaultPart);return exam==='csir'?['A','B','C'].map(p=>{const m=marking(exam,subject,p);return `Part ${p}: +${fmt(m[0])} correct / −${fmt(m[1])} incorrect`}).join('<br>'):`+${fmt(positive)} correct / ${exam==='psc'?'−⅓':'0'} incorrect`;}
function examControls(){return `<section class="card exam-settings"><div class="step">EXAM MODE</div><div class="exam-toggle" role="group" aria-label="Choose exam">${[['ugc','UGC NET'],['psc','PSC'],['csir','CSIR NET']].map(([key,label])=>`<button class="${exam===key?'active':''}" data-exam="${key}" aria-pressed="${exam===key}" ${busy?'disabled':''}>${label}</button>`).join('')}</div>${exam==='csir'?`<div class="exam-fields"><div><label for="subject">CSIR subject</label><select id="subject">${Object.entries(CSIR_RULES).map(([key,value])=>`<option value="${key}" ${subject===key?'selected':''}>${value.name}</option>`).join('')}</select></div><div><label for="part">Default section for rows without a section</label><select id="part">${['A','B','C'].map(p=>`<option value="${p}" ${p===defaultPart?'selected':''}>Part ${p}</option>`).join('')}</select></div></div>`:''}<p class="muted">${exam==='psc'?'Kerala PSC standard objective-test marking. ':''}Choose the scoring mode, then upload questions for that exam. Changing mode does not change your question bank.</p><div class="rules" style="margin-bottom:0">${ruleSummary()}<br>Skipped, timed-out and unanswered: 0 marks.${exam==='csir'?'<br>Practice mode scores every uploaded question; official section attempt limits are not enforced.':''}</div></section>`;}

function setup(){phase='setup';clearInterval(interval);$('page-title').textContent='Make every question count.';$('subtitle').textContent='Your question bank. Your pace. Instant feedback.';
$('app').innerHTML=examControls()+`<div class="layout"><section class="card"><div class="step">01 / QUESTION BANK</div><h2>Bring your own questions</h2><p class="muted">Upload a CSV, or try the included UGC NET Paper I set.</p><div class="drop" id="drop"><div class="upload-icon" aria-hidden="true">↥</div><h3>Drop your CSV here</h3><p class="muted">Up to 1,000 questions · Maximum 5 MB</p><button class="primary" id="browse" ${busy?'disabled':''}>${busy?'Reading file…':'Choose CSV file'}</button><input type="file" id="file" accept=".csv,text/csv" hidden></div>${error?`<div class="error" role="alert">${esc(error)}</div>`:''}${bank.length?`<div class="loaded" role="status"><strong>✓ ${bank.length} questions ready</strong><br><span class="muted">${esc(filename)}</span></div>`:''}<div class="divider"></div><div class="sample"><div class="row"><div class="iconbox">CSV</div><div><strong>UGC NET · Paper I</strong><p class="muted">100 previous-year-style practice questions</p></div></div><button class="secondary" id="sample" ${busy?'disabled':''}>Use sample</button></div><details><summary>CSV format & sample download</summary><p>Required headers: <code>question, option 1, option 2, option 3, option 4, answer</code>. The answer may be the exact option text, A–D, or 1–4. An optional <code>explanation</code> column appears after answering. Extra columns such as <code>number</code> are accepted. For CSIR NET, add <code>section</code> with A, B or C for mixed-part files; missing sections use the chosen default. Mathematical Sciences Part C accepts multiple correct answers as <code>A;C</code> (or <code>1;3</code>) and awards marks only for an exact match.</p><p>Save as UTF-8 CSV. Enclose text containing commas or line breaks in double quotes.</p><a href="sample.csv" download>Download sample CSV</a></details></section><aside class="card"><div class="step">02 / TEST SETTINGS</div><h2>Set your pace</h2><div class="field"><label for="timed">Question timer</label><input id="timed" type="checkbox" ${timed?'checked':''}></div><div class="field"><label for="seconds">Seconds per question</label><input class="num" type="number" id="seconds" min="1" max="3600" value="${seconds}" ${!timed?'disabled':''}></div><p class="muted">The timer restarts with each question. When time runs out, the answer is revealed.</p>${bank.length&&timed?`<details><summary>Set individual question times</summary><div class="timer-settings">${bank.map((q,i)=>`<div class="field"><label for="time-${i}">Question ${i+1}</label><input class="num custom-time" id="time-${i}" data-index="${i}" type="number" min="1" max="3600" value="${overrides[i]??seconds}" aria-label="Seconds for question ${i+1}"></div>`).join('')}</div></details>`:''}<div class="divider"></div><div class="rules">${ruleSummary()}<br>✓ Instant feedback after each answer</div><button class="primary wide" id="start" ${!bank.length||busy?'disabled':''}>Start test${bank.length?' · '+bank.length+' questions':''}</button><p class="muted" style="text-align:center;margin-bottom:0">${bank.length?'Ready when you are.':'Load a question bank to begin.'}</p></aside></div>`;
const sampleLink=document.querySelector('a[download]');sampleLink.href='data:text/csv;charset=utf-8,'+encodeURIComponent(BUNDLED_SAMPLE_CSV);sampleLink.download='sample.csv';
$('browse').onclick=()=>$('file').click();$('file').onchange=e=>readFile(e.target.files[0]);$('sample').onclick=loadSample;
const d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])};
document.querySelectorAll('[data-exam]').forEach(el=>el.onclick=()=>{exam=el.dataset.exam;error='';setup()});if($('subject'))$('subject').onchange=e=>{subject=e.target.value;error='';setup()};if($('part'))$('part').onchange=e=>{defaultPart=e.target.value;error='';setup()};
$('timed').onchange=e=>{timed=e.target.checked;setup()};$('seconds').onchange=e=>{if(!e.target.checkValidity()){e.target.reportValidity();return;}seconds=Number(e.target.value);setup()};document.querySelectorAll('.custom-time').forEach(el=>el.onchange=e=>{if(!el.checkValidity()){el.reportValidity();return;}overrides[el.dataset.index]=Number(el.value)});$('start').onclick=start;
}
async function readFile(file){if(!file||busy)return;if(!/\.csv$/i.test(file.name)){error='Please choose a .csv file.';setup();return}if(file.size>5*1024*1024){error='The file is too large. Maximum size is 5 MB.';setup();return}busy=true;setup();try{const parsed=parseCSV(await file.text());bank=parsed;filename=file.name;overrides={};error=''}catch(e){error=e.message}finally{busy=false;setup()}}
async function loadSample(){if(busy)return;busy=true;setup();try{bank=parseCSV(BUNDLED_SAMPLE_CSV);filename='UGC NET Paper I · 100 practice questions';overrides={};error=''}catch(e){error=e.message}finally{busy=false;setup()}}
function start(){const fields=Array.from(document.querySelectorAll('input[type=number]:not(:disabled)'));const invalid=fields.find(x=>!x.checkValidity());if(invalid){invalid.reportValidity();return}if(!bank.length)return;const invalidMulti=bank.findIndex(q=>q.correctAnswers.length>1&&!(exam==='csir'&&subject==='math'&&(q.section||defaultPart)==='C'));if(invalidMulti>=0){error=`Question ${invalidMulti+1} has multiple correct answers. Select CSIR NET / Mathematical Sciences / Part C, or use a single-answer CSV.`;setup();return;}questions=bank.map(q=>({...q,part:q.section||defaultPart,marks:marking(exam,subject,q.section||defaultPart),multi:exam==='csir'&&subject==='math'&&(q.section||defaultPart)==='C'}));results=[];index=0;phase='test';$('page-title').textContent='A little practice. A lot of progress.';$('subtitle').textContent=examLabel()+' · '+filename;nextQuestion();}
function nextQuestion(){pending=[];clearInterval(interval);deadline=Date.now()+(overrides[index]??seconds)*1000;renderTest();if(timed)interval=setInterval(tick,200);}
function tick(){if(phase!=='test'||results[index])return;const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=$('timer');if(el){el.textContent=remaining+'s remaining';el.classList.toggle('urgent',remaining<=5)}if(Date.now()>=deadline)answer(null);}
function answer(choice){if(phase!=='test'||results[index])return;if(timed&&Date.now()>=deadline)choice=null;clearInterval(interval);results[index]={choice,status:grade(questions[index],choice)};renderTest();}
function renderTest(){const q=questions[index],r=results[index],done=results.filter(Boolean).length;const t=totals();
$('app').innerHTML=`<div class="layout"><section class="card"><div class="topline"><span class="question-label">QUESTION ${String(index+1).padStart(2,'0')} OF ${questions.length}</span><span class="timer" id="timer">${r?'Answer locked':timed?Math.max(0,Math.ceil((deadline-Date.now())/1000))+'s remaining':'Untimed'}</span></div><div class="progress" aria-label="Test progress"><span style="width:${done/questions.length*100}%"></span></div><h2 class="question" style="font-size:23px;margin-bottom:25px">${esc(q.question)}</h2><p class="muted">${exam==='csir'?'Part '+q.part+' · ':''}+${fmt(q.marks[0])} correct · ${exam==='psc'?'−⅓':'−'+fmt(q.marks[1])} incorrect${q.multi?' · Select all correct options, then submit.':''}</p><div class="options">${q.options.map((o,i)=>`<button class="option ${r&&q.correctAnswers.includes(i)?'correct':r&&(Array.isArray(r.choice)?r.choice.includes(i):i===r.choice)?'wrong':!r&&pending.includes(i)?'selected':''}" data-choice="${i}" ${q.multi?`aria-pressed="${pending.includes(i)}"`:""} ${r?'disabled':''}><span class="letter">${r&&q.correctAnswers.includes(i)?'✓':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${r?`<div class="feedback ${r.status==='correct'?'good':''}" role="status"><strong>${r.status==='correct'?'✓ Correct! +'+fmt(q.marks[0])+' marks':r.status==='timeout'?'Time’s up.':r.status==='skipped'?'Question skipped.':'Incorrect. '+(q.marks[1]?'−'+(exam==='psc'?'⅓':fmt(q.marks[1]))+' marks.':'0 marks.')}</strong>${r.status!=='correct'?`<br>Correct answer: ${esc(rightText(q))}`:''}${q.explanation?`<p>${esc(q.explanation)}</p>`:''}</div>`:''}${q.multi&&!r?`<button class="primary wide" id="submit-multi" style="margin-top:18px" ${pending.length?'':'disabled'}>Submit answer</button>`:''}<div class="actions"><button class="secondary" id="end">End test</button>${r?`<button class="primary" id="next">${index===questions.length-1?'View results':'Next question'}</button>`:'<button class="secondary" id="skip">Skip question</button>'}</div></section><aside><section class="card"><div class="step">LIVE NET SCORE</div><div class="score" aria-live="polite">${fmt(t.net)} <small>/ ${fmt(t.max)} marks</small></div><p class="muted">${done} of ${questions.length} questions completed</p><div class="divider"></div><div class="stat"><span>Correct answers</span><strong style="color:#278149">${score()}</strong></div><div class="stat"><span>Marks earned</span><strong>+${fmt(t.earned)}</strong></div><div class="stat"><span>Marks deducted</span><strong>−${fmt(t.deducted)}</strong></div><div class="stat"><span>Incorrect</span><strong>${results.filter(x=>x?.status==='wrong').length}</strong></div><div class="stat"><span>Skipped / timed out</span><strong>${results.filter(x=>['timeout','skipped'].includes(x?.status)).length}</strong></div><div class="divider"></div><strong style="font-size:14px">Your progress</strong><div class="grid">${questions.map((_,i)=>`<span class="dot ${results[i]?.status||''} ${i===index?'current':''}" title="Question ${i+1}: ${results[i]?.status||'unanswered'}">${i+1}</span>`).join('')}</div></section></aside></div>`;
document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{const choice=Number(el.dataset.choice);if(!q.multi){answer(choice);return;}if(timed&&Date.now()>=deadline){answer(null);return;}pending=pending.includes(choice)?pending.filter(x=>x!==choice):[...pending,choice];document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.toggle('selected',pending.includes(Number(b.dataset.choice)));b.setAttribute('aria-pressed',String(pending.includes(Number(b.dataset.choice))))});$('submit-multi').disabled=!pending.length;});if($('submit-multi'))$('submit-multi').onclick=()=>{if(pending.length)answer([...pending])};if($('next'))$('next').onclick=()=>{if(index===questions.length-1)finish();else{index++;nextQuestion();}};if($('skip'))$('skip').onclick=()=>answer(-1);$('end').onclick=()=>{if(confirm('End this test and view results? Unanswered questions receive no points.'))finish()};}
function finish(){clearInterval(interval);phase='results';$('page-title').textContent='Practice complete.';$('subtitle').textContent='Review your answers and take what you learned into the next attempt.';const correct=score(),attempted=results.filter(x=>['correct','wrong'].includes(x?.status)).length,t=totals();
$('app').innerHTML=`<div class="layout"><section class="card"><div class="step">YOUR RESULTS</div><h2>${fmt(t.net/t.max*100)}% net score</h2><div class="results-number">${fmt(t.net)}<small> / ${fmt(t.max)} marks</small></div><p class="muted">${esc(examLabel())} · ${correct} correct · Earned ${fmt(t.earned)} − deducted ${fmt(t.deducted)}</p><p class="muted">${attempted} answered · ${results.filter(x=>x?.status==='wrong').length} incorrect · ${questions.length-attempted} skipped, timed out or unanswered</p><div class="actions"><button class="primary" id="retry">Try again</button><button class="secondary" id="new">Set up a new test</button></div><div class="divider"></div><h2>Answer review</h2>${questions.map((q,i)=>{const r=results[i];return`<article class="review"><span class="tag">${i+1} / ${r?.status||'Unanswered'} / ${delta(i)>0?'+':''}${fmt(delta(i))} marks${exam==='csir'?' / Part '+q.part:''}</span><p><strong>${esc(q.question)}</strong></p><p class="muted">Your answer: ${r&&['correct','wrong'].includes(r.status)?esc(answerText(q,Array.isArray(r.choice)?r.choice:[r.choice])):'No answer'}</p><p style="color:#22683d">✓ Correct answer: ${esc(rightText(q))}</p>${q.explanation?`<p class="muted">${esc(q.explanation)}</p>`:''}</article>`}).join('')}</section><aside class="card"><div class="step">KEEP THE MOMENTUM</div><h2>Every attempt teaches you.</h2><p class="muted">Look through the answer review, then try the test again at your own pace.</p><div class="rules">${ruleSummary()}<br>Skipped / unanswered: 0.${exam==='csir'?'<br>Practice score: section attempt limits are not enforced.':''}</div></aside></div>`;$('retry').onclick=()=>start();$('new').onclick=setup;window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('beforeunload',e=>{if(phase==='test'){e.preventDefault();e.returnValue=''}});setup();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'get_mock_test_status',description:'Read the current mock test phase, question count and live score.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:input=>{if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('No inputs are accepted.');return{phase,questions:phase==='setup'?bank.length:questions.length,currentQuestion:phase==='test'?index+1:null,correct:score(),netMarks:fmt(totals().net),exam:examLabel()}}})).catch(()=>{});}catch{}}
}
</script></body></html>
